name: Syntax Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python compile (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile all Python scripts
        run: |
          python -m py_compile scripts/run_all_checkin.py scripts/qoder_checkin.py scripts/qoder_extract.py scripts/signin.py
          echo "All Python scripts compiled OK"

  node:
    name: Node syntax (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check all JS modules
        run: |
          node --check scripts/trae_checkin_api.mjs
          node --check scripts/trae_checkin.mjs
          echo "All JS modules OK"
