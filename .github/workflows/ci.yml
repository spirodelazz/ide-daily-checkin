name: Syntax Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python compile (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      # ubuntu-latest 已迁移到 24.04/26.04，setup-python 在这些镜像上没有 3.9 的
      # toolcache 构建（报 "The version '3.9' ... was not found for Ubuntu 26.04"），
      # 所以 3.9 固定跑在仍有 3.9 的 ubuntu-22.04 上，其余组合跟 latest。
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.9'
          - os: windows-latest
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile all Python scripts
        run: |
          python -m py_compile scripts/run_all_checkin.py scripts/qoder_checkin.py scripts/qoder_extract.py scripts/signin.py scripts/streak_warmup.py
          echo "All Python scripts compiled OK"

  node:
    name: Node syntax (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check all JS modules
        run: |
          node --check scripts/trae_auth.mjs
          node --check scripts/trae_checkin_api.mjs
          node --check scripts/trae_keepalive.mjs
          echo "All JS modules OK"
